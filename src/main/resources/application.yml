spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${API_CONTEXT_PATH:/api}

springdoc:
  swagger-ui:
    path: /swagger-ui.html